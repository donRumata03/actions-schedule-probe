name: GitHub schedule probe
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record event and time
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          date -u --iso-8601=seconds
